<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DataFog</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #fff;
        --text: #1f1f1f;
        --muted: #666;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #1a2226;
          --text: #eef0ef;
          --muted: #a7b2b1;
        }
      }
      body {
        font:
          14px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        background: var(--background);
        color: var(--text);
        margin: 16px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 15px;
        margin: 20px 0 4px;
      }
      .muted {
        color: var(--muted);
        font-size: 13px;
        margin: 0;
      }
      button {
        margin-top: 24px;
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid var(--text);
        background: var(--background);
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>DataFog</h1>
    <p class="muted">Checks run on this device; nothing is sent anywhere.</p>

    <section id="vault">
      <h2>Vault</h2>
      <p class="muted">Coming soon.</p>
    </section>

    <section id="workspace">
      <h2>Workspace</h2>
      <p class="muted">Coming soon.</p>
    </section>

    <section id="restore">
      <h2>Restore</h2>
      <p class="muted">Coming soon.</p>
    </section>

    <button id="settings" type="button">Settings</button>

    <script src="panel.js"></script>
  </body>
</html>
