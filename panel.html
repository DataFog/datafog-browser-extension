<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>datafog</title>
    <link rel="stylesheet" href="theme.css" />
    <style>
      body {
        font: 13px/1.5 var(--sans);
        background: var(--surface);
        color: var(--text);
        margin: 0;
        padding: 12px;
      }
      h2 {
        margin: 0;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      svg.lucide {
        flex: none;
      }
      [hidden] {
        display: none !important;
      }

      /* Header: wordmark and the vault status chip */
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 12px;
      }
      .top .chip {
        margin-left: auto;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        font-size: 18px;
        font-weight: 300;
        letter-spacing: -0.03em;
      }
      .brand svg {
        width: 22px;
        height: auto;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 28px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: var(--radius-pill);
        background: var(--surface);
        color: var(--text);
        font: 11px var(--mono);
        cursor: pointer;
      }
      .chip .state {
        color: var(--muted);
      }
      .chip .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--muted);
      }
      .chip[data-access="ready"] .dot {
        background: var(--ok);
      }
      .chip[data-access="unavailable"] .dot {
        background: var(--accent-text);
      }

      /*
       * One shape rule: anything rounded is a full pill (chip, tokens,
       * inputs, buttons). Structure comes from hairline rows, not boxes.
       */
      .tabs {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        margin: 0 -12px 4px;
        padding: 0 12px;
        border-bottom: 1px solid var(--line);
      }
      .tabs button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 40px;
        padding: 0 8px;
        margin-bottom: -1px;
        border: 0;
        border-bottom: 2px solid transparent;
        border-radius: 0;
        background: none;
        color: var(--muted);
        font: inherit;
        cursor: pointer;
      }
      .tabs button:hover:not(:disabled) {
        background: none;
        color: var(--text);
      }
      .tabs button[aria-pressed="true"] {
        border-bottom-color: var(--accent);
        color: var(--text);
        font-weight: 500;
      }

      /* Sections are a kicker heading over rows */
      .card {
        position: relative;
        margin-bottom: 16px;
      }
      .heading {
        display: flex;
        align-items: center;
        gap: 4px;
        min-height: 36px;
        margin-top: 8px;
      }
      .heading h2 {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font: 10px/1.4 var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      li {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 40px;
        border-top: 1px solid var(--line);
        overflow-wrap: anywhere;
      }
      li .value {
        flex: 1;
        min-width: 0;
      }
      li .kicker {
        display: block;
        color: var(--muted);
        font: 10px/1.4 var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .token {
        display: inline-block;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        padding: 1px 8px;
        border-radius: var(--radius-pill);
        background: var(--token-bg);
        color: var(--token-text);
        font: 11px/1.5 var(--mono);
        vertical-align: middle;
      }
      .scope {
        flex: none;
        padding: 0 8px;
        border: 1px solid var(--line);
        border-radius: var(--radius-pill);
        color: var(--muted);
        font: 10px/18px var(--mono);
      }
      li.added {
        animation: added 2s ease-out;
      }
      @keyframes added {
        from {
          background: color-mix(in srgb, var(--ok) 25%, transparent);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        li.added {
          animation: none;
        }
      }
      .empty {
        margin: 0;
        padding: 12px 0;
        color: var(--muted);
      }
      .empty:empty {
        display: none;
      }

      /* Controls */
      input,
      textarea {
        box-sizing: border-box;
        min-height: 32px;
        padding: 0 12px;
        border-radius: var(--radius-pill);
        border: 1px solid var(--line);
        background: var(--field);
        color: var(--text);
        font: inherit;
      }
      input:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 1px;
      }
      input[type="checkbox"] {
        min-height: 0;
        accent-color: var(--accent);
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 32px;
        padding: 0 14px;
        border-radius: var(--radius-pill);
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: var(--hover);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.primary:hover:not(:disabled) {
        background: var(--accent-hover);
      }
      button.danger {
        background: var(--error);
        border-color: var(--error);
        color: #fff;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button.icon {
        width: 32px;
        padding: 0;
        border-color: transparent;
        background: none;
        color: var(--muted);
      }
      button.icon:hover:not(:disabled),
      button.icon[aria-expanded="true"] {
        color: var(--text);
      }
      button.quiet {
        padding: 0 4px;
        border: 0;
        background: none;
        color: var(--muted);
      }
      button.quiet:hover:not(:disabled) {
        background: none;
        color: var(--text);
      }
      form,
      .row {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      form.add,
      form.search {
        flex-direction: row;
        align-items: center;
        gap: 4px;
        padding: 8px 0;
        border-top: 1px solid var(--line);
      }
      form.search {
        border: 0;
        padding: 12px 0;
      }
      form.add input,
      form.search input {
        flex: 1;
        min-width: 0;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      label.check {
        flex-direction: row;
        align-items: center;
        gap: 8px;
        min-height: 36px;
        border-top: 1px solid var(--line);
      }
      .heading + label.check {
        border-top: 0;
      }
      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      /* Info popovers hold the explanations that used to sit under headings */
      .info {
        margin: 0 0 8px;
        padding: 0;
        color: var(--muted);
      }
      .info p {
        margin: 0;
      }

      /* Status lines */
      .error,
      .warning {
        margin: 8px 0;
        color: var(--error);
      }
      p.status {
        display: flex;
        align-items: center;
        gap: 6px;
        min-height: 1.5em;
        margin: 4px 0;
        color: var(--muted);
      }
      p.status.ok {
        color: var(--ok);
      }
      #lookup-result:empty {
        display: none;
      }
      #lookup-result {
        margin: 0 0 8px;
      }
    </style>
  </head>
  <body>
    <header class="top">
      <h1 class="brand" id="brand">datafog</h1>
      <button
        id="vault-chip"
        class="chip"
        type="button"
        aria-expanded="false"
        aria-controls="vault-info"
        data-access="initializing"
      >
        <span class="dot" aria-hidden="true"></span>vault
        <span id="vault-state" class="state" role="status">opening…</span>
      </button>
      <button
        id="settings"
        class="icon"
        type="button"
        data-icon="settings"
        title="Settings"
      >
        <span class="sr">Settings</span>
      </button>
    </header>
    <div id="vault-info" class="info" hidden>
      <p>
        Your vault is an encrypted store on this device. It opens automatically
        in this Chrome profile, so anyone using the profile can use it.
        Originals stay until you delete them in settings.
      </p>
      <button
        id="vault-settings"
        class="quiet"
        type="button"
        data-icon="external"
      >
        Open settings
      </button>
    </div>
    <nav class="tabs" aria-label="Sidebar views">
      <button
        type="button"
        data-view="data"
        data-icon="originals"
        aria-pressed="true"
      >
        Originals
      </button>
      <button
        type="button"
        data-view="rules"
        data-icon="allow"
        aria-pressed="false"
      >
        Rules
      </button>
    </nav>
    <p id="vault-error" class="error" role="alert" hidden></p>
    <button id="retry-access" type="button" data-icon="retry" hidden>
      Retry
    </button>
    <div id="unlocked" hidden>
      <section data-section="data">
        <div class="card">
          <form id="lookup" class="search">
            <label class="sr" for="lookup-marker">Find a token</label
            ><input
              id="lookup-marker"
              type="search"
              placeholder="Find a token or value"
              autocomplete="off"
            /><button
              type="submit"
              class="icon"
              data-icon="search"
              title="Look up original"
            >
              <span class="sr">Look up original</span>
            </button>
          </form>
          <p id="lookup-result" role="status"></p>
          <ul id="originals"></ul>
          <p id="originals-note" class="empty"></p>
        </div>
      </section>
      <section data-section="rules" hidden>
        <div class="card">
          <div class="heading">
            <h2 data-icon="allow">Always allow</h2>
          </div>
          <ul id="allowlist"></ul>
          <ul id="not-sensitive"></ul>
          <form id="allowlist-add" class="add">
            <input
              id="allowlist-value"
              aria-label="Value to always allow"
              placeholder="Add a value"
              autocomplete="off"
            /><button type="submit" class="icon" data-icon="add" title="Add">
              <span class="sr">Add</span>
            </button>
          </form>
        </div>
        <div class="card">
          <div class="heading">
            <h2 data-icon="flag">Always flag</h2>
          </div>
          <ul id="denylist"></ul>
          <form id="denylist-add" class="add">
            <input
              id="denylist-value"
              aria-label="Phrase to always flag"
              placeholder="Add a phrase"
              autocomplete="off"
            /><button type="submit" class="icon" data-icon="add" title="Add">
              <span class="sr">Add</span>
            </button>
          </form>
        </div>
      </section>
    </div>
    <p id="save-status" class="status" role="status"></p>
    <div id="update" class="row card" hidden>
      <p>An update is ready.</p>
      <button id="update-now" type="button" data-icon="retry">
        Update now
      </button>
    </div>
    <script src="panel.js"></script>
  </body>
</html>
