name: Release

# Pushing a tag such as v1.0.0 builds the extension, checks it against the
# changelog, and publishes a GitHub release with the zip for the Chrome Web
# Store
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The tag's name is read from the environment, never interpolated into
      # the shell
      - name: Check the tag, versions and changelog
        run: node scripts/check-release.mjs --tag "$GITHUB_REF_NAME" --notes release-notes.md

      # Only what's merged to main, and so tested in CI, is released
      - name: Check the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Audit shipped dependencies
        run: npm audit --omit=dev

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build and package
        run: npm run package

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/datafog-*.zip
          --verify-tag
          --title "DataFog ${GITHUB_REF_NAME#v}"
          --notes-file release-notes.md
