name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes the run in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Audit, format, lint, typecheck, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Any advisory in what ships with the extension fails; development tools
      # fail only on critical ones, since their fixes can lag behind
      - name: Audit shipped dependencies
        run: npm audit --omit=dev

      - name: Audit development dependencies
        run: npm audit --audit-level=critical

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

  extension-integration:
    name: Extension integration tests (${{ matrix.os }}, ${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        browser: [chrome]
        include:
          # Edge comes installed on Windows runners. It doesn't block merges
          # until it has passed reliably.
          - os: windows-latest
            browser: msedge
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.browser == 'msedge' }}
    env:
      E2E_BROWSER: ${{ matrix.browser }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Google Chrome and system dependencies
        if: ${{ matrix.browser == 'chrome' }}
        run: npx playwright install --with-deps chrome

      - name: Run extension integration tests
        run: npm run test:integration

      - name: Upload browser report and failure traces
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: extension-integration-${{ matrix.os }}-${{ matrix.browser }}
          retention-days: 7
          path: |
            playwright-report/
            test-results/
