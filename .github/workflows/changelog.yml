name: Changelog

# Reruns when the description or labels change, so adding an exemption takes
# effect without a new push
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - labeled
      - unlabeled
      - ready_for_review

permissions:
  contents: read

# Opening a PR with a label sends opened and labeled at once. Only the newest
# run per PR matters.
concurrency:
  group: changelog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Changelog policy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # The PR description is read from the event file, never interpolated
      # into the shell
      - name: Check for a changelog entry or exemption
        env:
          CHANGELOG_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-changelog.mjs --event "$GITHUB_EVENT_PATH"
